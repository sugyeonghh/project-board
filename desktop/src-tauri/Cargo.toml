[package]
name = "pmboard"
version = "0.1.0"
description = "프로젝트 보드 데스크톱 앱"
edition = "2021"

[lib]
name = "pmboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# 설치 파일을 작게
codegen-units = 1
lto = true
opt-level = "s"
strip = true
